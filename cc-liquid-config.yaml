is_testnet: false
active_profile: default
profiles:
  default:
    owner: '0x1234567890abcdef1234567890abcdef12345678'
    vault: null
    signer_env: HYPERLIQUID_PRIVATE_KEY
data:
  source: crowdcent
  path: predictions.parquet
  date_column: release_date
  asset_id_column: id
  prediction_column: pred_10d
portfolio:
  num_long: 60
  num_short: 50
  target_leverage: 4
  rank_power: 0.0
  stop_loss:
    sides: short_only
    pct: 0.17
    slippage: 0.07
  rebalancing:
    every_n_days: 10
    at_time: '18:05'
execution:
  order_type: limit
  time_in_force: Gtc
  limit_price_offset: 0.0

# Autotrade: Profit-taking cycle strategy
# Opens positions at opening_time, monitors PNL, closes when profit target hit
autotrade:
  profit_target_pct: 5.0        # Close all positions and take profit when portfolio PNL >= this % (default: 15.0)
  max_hold_days: 10              # Force rebalance after this many calendar days (default: 10)
  opening_time: '00:00'          # UTC time to open new positions after taking profit (HH:MM format)
  monitor_interval_seconds: 5.0  # How often to check PNL and update dashboard (default: 5.0)
  enable_rebalance: true         # If true, rebalance on max_hold_days; if false, wait for profit target indefinitely
