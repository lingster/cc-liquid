[package]
name = "hl-recorder"
version = "0.1.0"
edition = "2021"
description = "Hyperliquid Digital Twin — tick-by-tick L2/mids/trades recorder"
license = "MIT"

[[bin]]
name = "hl-recorder"
path = "src/main.rs"

[lib]
name = "hl_recorder"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "53"
parquet = "53"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
